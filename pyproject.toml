[project]
name = "toronto-election-poll-tracker-backend"
version = "0.1.0"
description = "Toronto election modelling and derived frontend feeds"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "geopandas>=1.1.4",
    "lxml>=6.1.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.3",
    "openpyxl>=3.1.5",
    "pandas",
    "pydantic",
    "pyreadstat>=1.3.6",
    "python-docx>=1.2.0",
    "rapidfuzz>=3.14.5",
    "requests",
    "scikit-learn>=1.9.0",
    "shapely>=2.1.2",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
